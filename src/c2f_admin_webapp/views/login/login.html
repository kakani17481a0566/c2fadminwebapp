  <body  class="hold-transition login-page" >

      <div class="card">
        <div class="card-body login-card-body">
          <p class="login-box-msg">Sign in to start your session</p>
<!--          select language section-->
          
          <form action="/Login" autocomplete="off" method="post">
            <div class="input-group mb-3">
              <input type="email" class="form-control" placeholder="Email" name="username" id="username" onselectstart="return false" oncut="return false" oncopy="return false" onpaste="return false" >
              <div class="input-group-append">

                  <span class="fas fa-envelope"></span>
                </div>
              </div>
            </div>
            <div class="input-group mb-3">
              <input type="password" class="form-control" placeholder="Password" name="password" id="password" onselectstart="return false" oncut="return false" oncopy="return false" onpaste="return false">
                <div class="input-group-append">
                <span class="input-group-text" onclick="password_show_hide();">
                  <i class="fas fa-eye-slash" id="show_eye"></i>
                  <i class="fas fa-eye d-none" id="hide_eye"></i>
                </span>
              </div>
            </div>
            <div class="form-row" style="padding-bottom: 15px;">
                <label id="lang"> Select Language</label>
                <select class="form-control" id="language" name="language">
                    <option value="English" id="EN">English</option>
                    <option value="Telugu" id="TN">Telugu</option>
                </select>
            </div>
             
            <div class="row">
              <!-- /.col -->
              <div class="col-12">
                <button type="submit" class="btn btn-primary btn-block" id="signin-button">Sign In</button>
              </div>
              
              <!-- /.col -->
              
              <a href="/ForgotPassword" id="forgot">Forgot Password</a>
            </div>
            <!-- <p class="mb-1">
              <a href="/ForgotPassword">Forgot Password</a>
            </p> -->
          </form>
          <!-- /.social-auth-links -->

    <script type="text/javascript">
                
                function password_show_hide() {
  var x = document.getElementById("password");
  var show_eye = document.getElementById("show_eye");
  var hide_eye = document.getElementById("hide_eye");
  hide_eye.classList.remove("d-none");
  if (x.type === "password") {
    x.type = "text";
    show_eye.style.display = "none";
    hide_eye.style.display = "block";
  } else {
    x.type = "password";
    show_eye.style.display = "block";
    hide_eye.style.display = "none";
  }
}
</script>
