<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>C2F Admin | Log in</title>
    <!-- Tell the browser to be responsive to screen width -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="/static/dist/img/logo-s.png" type="image/gif" sizes="16x16">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="../../static/plugins/fontawesome-free/css/all.min.css">
    <!-- Ionicons -->
    <link rel="stylesheet" href="https://code.ionicframework.com/ionicons/2.0.1/css/ionicons.min.css">
    <!-- icheck bootstrap -->
    <link rel="stylesheet" href="../../static/plugins/icheck-bootstrap/icheck-bootstrap.min.css">
    <!-- Theme style -->
    <link rel="stylesheet" href="static/dist/css/adminlte.min.css">
    <!-- Google Font: Source Sans Pro -->
    <link rel="stylesheet" href="../../static/dist/css/fonts/source-sans-pro.css">
     <link rel="stylesheet" type="text/css" href="../../static/plugins/duDialog-master/duDialog.css">
    
  </head>
  
  <body class="hold-transition login-page" >
    <!--  <body class="hold-transition login-page" style="background-image: url('/static/dist/img/loginbg.jpg'); background-size: cover;"> -->
    <div>
      <img src="static/dist/img/logo.png" alt="AdminLTE Logo" class="brand-image"
      style="opacity: .8" width="250" height="100">
    </div>
    <br>
    <div class="login-box">
      <!-- <div class="login-logo">
        <b>Auto Reconciliation</b>
      </div> -->
      <!-- /.login-logo -->
      <form id="forgotPass" action="/ForgotPassword"  method="post" autocomplete="off">
       <section class="content">
      <div class="card">
        <div class="card-body login-card-body">
          <p id="fpwd" class="login-box-msg">Forgot Password</p>
          <form action="/Login" method="post">
            <div class="input-group mb-3">
              <input type="email" class="form-control" placeholder="Email" name="username" id="username" onselectstart="return false" oncut="return false" oncopy="return false" onpaste="return false" >
              <div class="input-group-append">
                <div class="input-group-text">
                  <span class="fas fa-envelope"></span>
                </div>
              </div>
            </div>
             <div class="form-row" style="padding-bottom: 15px;">
                <label id="lang"> Select Language</label>
                <select class="form-control" id="language" name="language">
                    <option value="English" id="eng">English</option>
                    <option value="Telugu" id="tel">Telugu</option>
                </select>
            </div>
            
            <div class="row">
              <!-- /.col -->
              <div class="col-12">
                <button id="submit" type="submit" class="btn btn-primary btn-block">Submit</button>
              </div>
               <a id="back" href="/Login">Back</a>
              
              <!-- /.col -->
              
              
            </div>
            <!-- <p class="mb-1">
              <a href="/ForgotPassword">Forgot Password</a>
            </p> -->
          </form>
          <!-- /.social-auth-links -->
        </div>
        <!-- /.login-card-body -->
      </div>
    </div>
    </section>
    </form>
    <!-- /.login-box -->
    <!-- jQuery -->
    <script src="../../static/plugins/jquery/jquery.min.js"></script>
    <!-- Bootstrap 4 -->
    <script src="../../static/plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
     <script type="text/javascript" src="../../static/plugins/duDialog-master/duDialog.js"></script>
    <!-- AdminLTE App -->
    <script src="../../static/dist/js/adminlte.min.js"></script>
     <script type="text/javascript">
                var lang = {{.userLang}};
                $('#input_language').val(lang);
                </script>
                <script type="text/javascript">
                var data = {{.DisplayMessage}};
                if (data != ""){
                new duDialog('', data);
                }
                </script>
                
                
                 <script type="text/javascript"> 
  $("#language").change(function() {
    var x = $(this).val();
    if (x == "English") 
{
                  
                  
       
        $("#fpwd").text("Forgot Password");
        $("#username").attr("placeholder","Enter E-mail");
        $("#lang").text("Select Language");
        $("#eng").text("English");
        $("#tel").text("Telugu");
        $("#submit").text("Submit");
        $("#back").text("Back");
          
    } 
else if (x == "Telugu") 
{
                    
        $("#fpwd").text("పాస్‌వర్డ్ మర్చిపోయాను");
        $("#username").attr("placeholder","ఇ-మెయిల్ నమోదు చేయండి");
        $("#lang").text("భాషను ఎంచుకోండి");
        $("#eng").text("ఆంగ్ల");
        $("#tel").text("తెలుగు");
        $("#submit").text("సమర్పించండి");
        $("#back").text("వెనుకకు");
        
        }
                    });
                    
              </script>
                    
       
  </body>
